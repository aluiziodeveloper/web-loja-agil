services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/workspace
      - pnpm_store:/root/.local/share/pnpm/store
      - web_node_modules:/workspace/node_modules
    ports:
      - "5173:5173"
    command: sleep infinity

volumes:
  pnpm_store:
  web_node_modules:
